<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>雷達座標轉換器</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background-color: #1c1c1e; 
      color: #f2f2f7; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: 40px 20px; 
    }
    h2 { color: #34c759; margin-bottom: 20px; }
    textarea { 
      width: 100%; max-width: 400px; height: 80px; 
      border-radius: 12px; padding: 15px; font-size: 16px; 
      border: 1px solid #3a3a3c; background-color: #2c2c2e; 
      color: #fff; margin-bottom: 20px; resize: none; 
    }
    button { 
      width: 100%; max-width: 400px; 
      background-color: #34c759; color: black; 
      font-size: 18px; font-weight: bold; padding: 15px; 
      border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; 
    }
    button:active { background-color: #30b053; transform: scale(0.98); }
    .result-box { margin-top: 30px; text-align: center; height: 60px; }
    #output { font-size: 22px; font-weight: bold; color: #ffcc00; letter-spacing: 1px; }
    #toast { display: none; color: #34c759; margin-top: 10px; font-size: 15px; }
  </style>
</head>
<body>

  <h2>📍 座標一鍵轉換</h2>
  <textarea id="coordInput" placeholder="請在此貼上座標&#10;例如：北43.26132° 東141.96267°"></textarea>
  <button onclick="processCoord()">轉換並自動複製</button>

  <div class="result-box">
    <div id="output"></div>
    <div id="toast">✅ 已成功複製！可直接切換去遊戲貼上。</div>
  </div>

  <script>
    function processCoord() {
      const input = document.getElementById('coordInput').value;
      // 用正規表示式自動抓出小數點數字
      const nums = input.match(/\d+\.\d+/g);

      if (!nums || nums.length < 2) {
        document.getElementById('output').innerText = "⚠️ 格式錯誤或找不到數字";
        document.getElementById('output').style.color = "#ff3b30";
        return;
      }

      // 處理南半球與西半球的負號邏輯
      let lat = input.includes('南') ? '-' + nums[0] : nums[0];
      let lon = input.includes('西') ? '-' + nums[1] : nums[1];
      let result = `${lat},${lon}`;

      // 顯示結果
      document.getElementById('output').innerText = result;
      document.getElementById('output').style.color = "#ffcc00";

      // 自動拷貝到剪貼簿
      navigator.clipboard.writeText(result).then(() => {
        const toast = document.getElementById('toast');
        toast.style.display = "block";
        setTimeout(() => { toast.style.display = "none"; }, 2500);
      }).catch(err => {
        console.error('複製失敗', err);
      });
    }
  </script>
</body>
</html>
