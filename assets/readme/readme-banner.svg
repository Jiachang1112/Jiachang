<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-labelledby="t d">
  <title id="t">雲端資料庫 Jiachang</title>
  <desc id="d">檔案與資料夾雲端分享網站：Firebase 登入、會員審核、公告與管理後台</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082f49"/>
      <stop offset="0.55" stop-color="#0369a1"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#050a1f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="450" fill="url(#bg)"/>
  <rect width="1280" height="450" fill="url(#dots)"/>
  <circle cx="1170" cy="40" r="190" fill="#f59e0b" opacity="0.35"/>
  <circle cx="90" cy="430" r="150" fill="#38bdf8" opacity="0.25"/>
  <circle cx="1230" cy="420" r="120" fill="#8b5cf6" opacity="0.28"/>

  <g filter="url(#shadow)">
    <rect x="70" y="56" width="1140" height="338" rx="22" fill="#fdfdfb"/>
  </g>
  <rect x="70" y="56" width="1140" height="8" rx="4" fill="url(#bar)"/>
  <circle cx="106" cy="130" r="7" fill="#e2e5ee"/>
  <circle cx="106" cy="196" r="7" fill="#e2e5ee"/>
  <circle cx="106" cy="262" r="7" fill="#e2e5ee"/>

  <rect x="150" y="104" width="358" height="84" rx="6" fill="#ffe56a"/>
  <text x="162" y="168" font-family="'Noto Serif TC','Noto Serif CJK TC','Songti TC','PMingLiU',serif" font-size="66" font-weight="900" fill="#101a3d">雲端資料庫</text>

  <text x="152" y="228" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#4a5163">檔案分享  ・  會員審核  ・  站內公告  ・  管理後台</text>

  <g font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="600">
    <rect x="152" y="258" width="137" height="40" rx="20" fill="#0284c7"/>
    <text x="220.5" y="284" text-anchor="middle" fill="#ffffff">☁️ 檔案分享</text>
    <rect x="303" y="258" width="134" height="40" rx="20" fill="#f59e0b"/>
    <text x="370.0" y="284" text-anchor="middle" fill="#101a3d">👤 會員登入</text>
    <rect x="451" y="258" width="134" height="40" rx="20" fill="#8b5cf6"/>
    <text x="518.0" y="284" text-anchor="middle" fill="#ffffff">📢 站內公告</text>
    <rect x="599" y="258" width="137" height="40" rx="20" fill="#0b7a5c"/>
    <text x="667.5" y="284" text-anchor="middle" fill="#ffffff">🛠️ 管理後台</text>
  </g>
  <text x="152" y="350" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="18" fill="#7a8194">HTML ‧ JavaScript ‧ Firebase　GitHub Pages 靜態網站</text>

  <g transform="translate(878 112)">
    <path d="M60 150 a46 46 0 0 1 8 -90 a58 58 0 0 1 112 8 a42 42 0 0 1 4 82 Z" fill="#e0f2fe" stroke="#075985" stroke-width="6" stroke-linejoin="round"/>
    <rect x="52" y="118" width="86" height="92" rx="8" fill="#f59e0b" stroke="#7c4a00" stroke-width="5"/>
    <path d="M52 132 h86" stroke="#7c4a00" stroke-width="4"/>
    <rect x="150" y="140" width="84" height="70" rx="8" fill="#38bdf8" stroke="#075985" stroke-width="5"/>
    <path d="M192 196 V156 M176 172 l16 -16 16 16" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
